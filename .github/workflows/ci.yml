name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Locked manifest; hermetic pipeline — no Linear credentials, no org identifiers (constitution)
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      # Merge-blocking: any failure or coverage below the configured threshold fails the job
      - run: npm test
